<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>The Carter Projekt | Official Website</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a;
      color: #e5e5e5;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      scroll-behavior: smooth;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap');

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      padding: 1rem 2rem;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      transition: all 0.3s ease;
      border-bottom: 1px solid rgba(255, 153, 0, 0.2);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      height: 55px;
      width: auto;
      border-radius: 10px;
      transition: transform 0.2s;
    }

    .logo-img:hover {
      transform: scale(1.02);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #f90, #ffdd88);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.8rem;
    }

    .nav-links li a {
      color: #f0f0f0;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
      position: relative;
    }

    .nav-links li a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0%;
      height: 2px;
      background: #f90;
      transition: width 0.25s;
    }

    .nav-links li a:hover::after,
    .nav-links li a.active::after {
      width: 100%;
    }

    .nav-links li a:hover {
      color: #f90;
    }

    .social-icons {
      display: flex;
      gap: 1.2rem;
      align-items: center;
    }

    .social-icons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .social-icons a .fa-instagram { color: #ffffff; transition: color 0.2s; }
    .social-icons a:hover .fa-instagram { color: #E4405F; }
    .social-icons a .fa-youtube { color: #ffffff; transition: color 0.2s; }
    .social-icons a:hover .fa-youtube { color: #FF0000; }
    .social-icons a .fa-facebook-f { color: #ffffff; transition: color 0.2s; }
    .social-icons a:hover .fa-facebook-f { color: #1877F2; }
    .social-icons a:hover { transform: translateY(-3px); }

    .menu-toggle {
      display: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #f90;
    }

    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.5) contrast(1.1);
    }

    .hero-text {
      color: white;
      z-index: 10;
      animation: fadeUp 0.8s ease-out;
    }

    .hero-text h1 {
      font-size: 4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #ffcc88);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .btn {
      background: linear-gradient(95deg, #f90, #ffb347);
      color: #111;
      padding: 0.9rem 2rem;
      border: none;
      text-decoration: none;
      font-weight: 700;
      border-radius: 40px;
      margin-top: 1rem;
      display: inline-block;
      transition: all 0.25s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      cursor: pointer;
      font-size: 1rem;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #f90;
      color: #f90;
      box-shadow: none;
      margin-left: 12px;
    }

    .btn-outline:hover {
      background: #f90;
      color: #111;
    }

    .btn:hover {
      transform: translateY(-3px);
      filter: brightness(1.05);
    }

    .section {
      padding: 5rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section h2 {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      border-left: 4px solid #f90;
      padding-left: 1.2rem;
      font-weight: 700;
    }

    .music-embed iframe {
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .tour-dates {
      list-style: none;
      background: rgba(20,20,20,0.6);
      border-radius: 24px;
      padding: 1.5rem;
      backdrop-filter: blur(4px);
    }

    .tour-dates li {
      margin-bottom: 1.2rem;
      padding: 0.8rem;
      border-bottom: 1px solid rgba(255,153,0,0.2);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .tour-dates li:last-child {
      border-bottom: none;
    }

    .video-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin: 2rem 0;
    }

    .video-gallery iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: transform 0.3s;
    }

    .video-gallery iframe:hover {
      transform: scale(1.02);
    }

    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .photo-gallery img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 20px;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .photo-gallery img:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }

    form input[type="email"] {
      padding: 1rem;
      flex: 1;
      min-width: 250px;
      border: none;
      border-radius: 60px;
      background: #222;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }

    form input[type="email"]:focus {
      box-shadow: 0 0 0 2px #f90;
      background: #2a2a2a;
    }

    form button {
      padding: 1rem 1.8rem;
      background: #f90;
      border: none;
      font-weight: 700;
      cursor: pointer;
      border-radius: 60px;
      transition: all 0.2s;
    }

    form button:hover {
      background: #ffa726;
      transform: translateY(-2px);
    }

    footer {
      background: #000;
      padding: 2rem;
      text-align: center;
      color: #777;
      border-top: 1px solid rgba(255,153,0,0.2);
    }

    .right-logo {
      height: 45px;
      width: auto;
      margin-top: 1rem;
      opacity: 0.8;
    }

    .volume-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 40px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 999;
      border: 1px solid rgba(255,153,0,0.4);
    }

    .volume-control i {
      color: #f90;
    }

    #volumeControl {
      width: 100px;
      cursor: pointer;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      .menu-toggle { display: block; }
      .nav-links {
        position: fixed;
        top: 75px;
        left: -100%;
        flex-direction: column;
        background: rgba(0,0,0,0.95);
        backdrop-filter: blur(20px);
        width: 70%;
        height: calc(100vh - 75px);
        padding: 2rem;
        gap: 1.5rem;
        transition: left 0.3s;
        border-radius: 0 20px 20px 0;
      }
      .nav-links.active { left: 0; }
      .hero-text h1 { font-size: 2.5rem; }
      .section h2 { font-size: 2rem; }
      .photo-gallery img { height: 280px; }
      .btn-outline { margin-left: 0; margin-top: 10px; }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo-container">
    <img src="Weixin Image_20260119132104_251_83.jpg" alt="Logo" class="logo-img" onerror="this.src='https://placehold.co/60x60?text=TCP'">
    <div class="logo">THE CARTER PROJEKT</div>
  </div>
  <div class="menu-toggle" id="mobileMenuToggle">☰</div>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="music.html">Music</a></li>
    <li><a href="tour.html">Tour</a></li>
    <li><a href="videos.html">Videos</a></li>
    <li><a href="photos.html">Photos</a></li>
    <li><a href="store.html">Store</a></li>
    <li><a href="newsletter.html">Newsletter</a></li>
    <li><a href="support.html">Support</a></li>
  </ul>
  <div class="nav-right">
    <div class="social-icons">
      <a href="https://www.instagram.com/thecarterprojekt" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://youtube.com/@gbanjah" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="https://www.facebook.com/carterprojekt" target="_blank"><i class="fab fa-facebook-f"></i></a>
    </div>
  </div>
</nav>

<section class="hero">
  <video autoplay muted loop id="bg-video">
    <source src="background.mp4" type="video/mp4" />
  </video>
  <div class="hero-text">
    <h1>NOW STREAMING</h1>
    <div>
      <a href="music.html" class="btn">Listen Now</a>
      <button id="playButton" class="btn btn-outline">Play Music</button>
    </div>
  </div>
</section>

<div class="volume-control">
  <i class="fas fa-volume-up"></i>
  <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.3">
</div>

<audio id="bgMusic" loop>
  <source src="AUDIO-2025-06-26-12-12-23.mp3" type="audio/mpeg">
</audio>

<footer>
  <p>&copy; 2025 The Carter Projekt. All rights reserved.</p>
  <img src="Weixin Image_20260119132104_251_83.jpg" alt="Logo" class="right-logo" onerror="this.style.display='none'">
</footer>

<script>
  const menuToggle = document.getElementById('mobileMenuToggle');
  const navLinks = document.getElementById('navLinks');
  if (menuToggle && navLinks) {
    menuToggle.addEventListener('click', () => navLinks.classList.toggle('active'));
    navLinks.querySelectorAll('a').forEach(link => link.addEventListener('click', () => navLinks.classList.remove('active')));
  }

  const bgAudio = document.getElementById('bgMusic');
  const playBtn = document.getElementById('playButton');
  const volumeSlider = document.getElementById('volumeControl');
  
  if (bgAudio) {
    bgAudio.volume = 0.3;
    if (playBtn) {
      playBtn.addEventListener('click', () => {
        if (bgAudio.paused) {
          bgAudio.play();
          playBtn.textContent = 'Pause Music';
        } else {
          bgAudio.pause();
          playBtn.textContent = 'Play Music';
        }
      });
    }
    if (volumeSlider) {
      volumeSlider.addEventListener('input', (e) => bgAudio.volume = parseFloat(e.target.value));
    }
  }

  const form = document.getElementById('newsletterForm');
  const emailInput = document.getElementById('emailInput');
  const formMessage = document.getElementById('formMessage');
  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (email && email.includes('@')) {
        formMessage.textContent = 'Thank you for subscribing! 🎵';
        emailInput.value = '';
        setTimeout(() => formMessage.textContent = '', 3000);
      } else {
        formMessage.textContent = 'Please enter a valid email address.';
      }
    });
  }

  const nav = document.querySelector('nav');
  window.addEventListener('scroll', () => {
    nav.style.background = window.scrollY > 50 ? '#000' : 'rgba(0,0,0,0.85)';
  });
</script>
</body>
</html>
