<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>The Carter Projekt | Videos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #0a0a0a; color: #e5e5e5; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700;800&display=swap');
    
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      padding: 1rem 2rem;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      transition: all 0.3s ease;
      border-bottom: 1px solid rgba(255, 153, 0, 0.2);
    }
    
    .logo-container { display: flex; align-items: center; gap: 12px; }
    .logo-img { height: 55px; width: auto; border-radius: 10px; transition: transform 0.2s; }
    .logo-img:hover { transform: scale(1.02); }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #f90, #ffdd88);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .nav-links { list-style: none; display: flex; gap: 1.8rem; }
    .nav-links li a {
      color: #f0f0f0;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
      position: relative;
    }
    .nav-links li a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0%;
      height: 2px;
      background: #f90;
      transition: width 0.25s;
    }
    .nav-links li a:hover::after,
    .nav-links li a.active::after { width: 100%; }
    .nav-links li a:hover { color: #f90; }
    
    .social-icons { display: flex; gap: 1.2rem; align-items: center; }
    .social-icons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      text-decoration: none;
      transition: transform 0.2s;
    }
    .social-icons a .fa-instagram { color: #ffffff; transition: color 0.2s; }
    .social-icons a:hover .fa-instagram { color: #E4405F; }
    .social-icons a .fa-youtube { color: #ffffff; transition: color 0.2s; }
    .social-icons a:hover .fa-youtube { color: #FF0000; }
    .social-icons a .fa-facebook-f { color: #ffffff; transition: color 0.2s; }
    .social-icons a:hover .fa-facebook-f { color: #1877F2; }
    .social-icons a:hover { transform: translateY(-3px); }
    
    .menu-toggle {
      display: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #f90;
    }
    
    .page-hero {
      height: 50vh;
      background: linear-gradient(135deg, #1a1a2e, #0a0a0a);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-top: 70px;
      position: relative;
    }
    .page-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('Weixin4.jpg') center/cover;
      opacity: 0.3;
      z-index: 0;
    }
    .page-hero div { position: relative; z-index: 1; }
    .page-hero h1 {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #f90);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .page-hero p { color: #ccc; font-size: 1.1rem; }
    
    .btn {
      background: linear-gradient(95deg, #f90, #ffb347);
      color: #111;
      padding: 0.9rem 2rem;
      border: none;
      text-decoration: none;
      font-weight: 700;
      border-radius: 40px;
      margin-top: 1rem;
      display: inline-block;
      transition: all 0.25s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .btn:hover { transform: translateY(-3px); filter: brightness(1.05); }
    
    .section { padding: 4rem 2rem; max-width: 1400px; margin: 0 auto; }
    .section h2 {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      border-left: 4px solid #f90;
      padding-left: 1.2rem;
      font-weight: 700;
    }
    
    .video-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.8rem;
      margin: 2rem 0;
    }
    .video-card {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    .video-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 30px rgba(0,0,0,0.4);
    }
    .video-thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }
    .video-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .video-card:hover .video-thumbnail img {
      transform: scale(1.05);
    }
    .play-icon {
      position: absolute;
      width: 60px;
      height: 60px;
      background: rgba(255,153,0,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s;
    }
    .play-icon i {
      font-size: 1.8rem;
      color: #111;
      margin-left: 5px;
    }
    .video-card:hover .play-icon {
      transform: scale(1.1);
    }
    .video-info {
      padding: 1rem;
      text-align: center;
    }
    .video-info h3 {
      font-size: 0.9rem;
      color: #f90;
      font-weight: 500;
    }
    .video-iframe {
      display: none;
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
    }
    .video-iframe.active {
      display: block;
    }
    .video-thumbnail.hidden {
      display: none;
    }
    
    footer {
      background: #000;
      padding: 2rem;
      text-align: center;
      color: #777;
      border-top: 1px solid rgba(255,153,0,0.2);
      margin-top: 2rem;
    }
    
    @media (max-width: 900px) {
      .menu-toggle { display: block; }
      .nav-links {
        position: fixed;
        top: 75px;
        left: -100%;
        flex-direction: column;
        background: rgba(0,0,0,0.95);
        backdrop-filter: blur(20px);
        width: 70%;
        height: calc(100vh - 75px);
        padding: 2rem;
        gap: 1.5rem;
        transition: left 0.3s;
        border-radius: 0 20px 20px 0;
      }
      .nav-links.active { left: 0; }
      .page-hero h1 { font-size: 2.5rem; }
      .section h2 { font-size: 2rem; }
      .video-gallery { grid-template-columns: 1fr; gap: 1.2rem; }
      .play-icon { width: 45px; height: 45px; }
      .play-icon i { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo-container">
    <img src="Weixin Image_20260119132104_251_83.jpg" alt="Left Logo" class="logo-img" onerror="this.src='https://placehold.co/60x60?text=TCP'">
    <div class="logo">THE CARTER PROJEKT</div>
  </div>
  <div class="menu-toggle" id="mobileMenuToggle">☰</div>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="music.html">Music</a></li>
    <li><a href="tour.html">Tour</a></li>
    <li><a href="videos.html">Videos</a></li>
    <li><a href="photos.html">Photos</a></li>
    <li><a href="store.html">Store</a></li>
    <li><a href="newsletter.html">Newsletter</a></li>
    <li><a href="support.html">Support</a></li>
  </ul>
  <div class="social-icons">
    <a href="https://www.instagram.com/thecarterprojekt" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://youtube.com/@gbanjah" target="_blank"><i class="fab fa-youtube"></i></a>
    <a href="https://www.facebook.com/carterprojekt" target="_blank"><i class="fab fa-facebook-f"></i></a>
  </div>
</nav>

<section class="page-hero">
  <div>
    <h1>OFFICIAL VIDEOS</h1>
    <p>Watch the latest music videos and performances</p>
    <a href="#videos" class="btn">Watch Now</a>
  </div>
</section>

<section id="videos" class="section">
  <h2>Music Videos</h2>
  <div class="video-gallery" id="videoGallery">
    <!-- Each video loads only when clicked -->
  </div>
</section>

<footer>
  <p>&copy; 2025 The Carter Projekt. All rights reserved.</p>
</footer>

<script>
  // Mobile menu toggle
  const menuToggle = document.getElementById('mobileMenuToggle');
  const navLinks = document.getElementById('navLinks');
  
  if (menuToggle && navLinks) {
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
    
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('active');
      });
    });
  }

  // Nav scroll effect
  const nav = document.querySelector('nav');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 50) {
      nav.style.background = '#000';
      nav.style.backdropFilter = 'blur(12px)';
    } else {
      nav.style.background = 'rgba(0,0,0,0.85)';
    }
  });

  // Set active nav link
  const currentPage = window.location.pathname.split('/').pop() || 'videos.html';
  document.querySelectorAll('.nav-links a').forEach(link => {
    const linkPage = link.getAttribute('href');
    if (currentPage === linkPage) {
      link.classList.add('active');
    }
  });

  // Video URLs (your original 13 videos)
  const videoUrls = [
    "https://www.youtube.com/embed/Ozyt0rLLs1E",
    "https://www.youtube.com/embed/3sr3Negd-As",
    "https://www.youtube.com/embed/AtD9uu_BCMQ",
    "https://www.youtube.com/embed/NKHegl-Idlk",
    "https://www.youtube.com/embed/D9rgM_cjhI8",
    "https://www.youtube.com/embed/QGj1_ASJ2nw",
    "https://www.youtube.com/embed/kiImm9GesGI",
    "https://www.youtube.com/embed/NRQkMOcTfQ4",
    "https://www.youtube.com/embed/Je--QT7XJ60",
    "https://www.youtube.com/embed/0VQqY0TMs2s",
    "https://www.youtube.com/embed/cspK2Amg1J0",
    "https://www.youtube.com/embed/GOaf8sfYT-M",
    "https://www.youtube.com/embed/zEJFYjIq2zQ"
  ];

  // YouTube thumbnail URLs (using video IDs)
  function getVideoId(url) {
    const match = url.match(/embed\/([^?]+)/);
    return match ? match[1] : null;
  }

  function getThumbnailUrl(videoId) {
    return `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
  }

  // Build the video gallery with lazy loading
  const videoGallery = document.getElementById('videoGallery');
  
  videoUrls.forEach((videoUrl, index) => {
    const videoId = getVideoId(videoUrl);
    const thumbnailUrl = videoId ? getThumbnailUrl(videoId) : '';
    
    const videoCard = document.createElement('div');
    videoCard.className = 'video-card';
    
    // Thumbnail container
    const thumbnailDiv = document.createElement('div');
    thumbnailDiv.className = 'video-thumbnail';
    thumbnailDiv.setAttribute('data-video-index', index);
    
    const img = document.createElement('img');
    img.src = thumbnailUrl;
    img.alt = `Video ${index + 1}`;
    img.loading = 'lazy';
    img.onerror = () => {
      // Fallback if maxresdefault doesn't exist
      img.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
    };
    
    const playIcon = document.createElement('div');
    playIcon.className = 'play-icon';
    playIcon.innerHTML = '<i class="fas fa-play"></i>';
    
    thumbnailDiv.appendChild(img);
    thumbnailDiv.appendChild(playIcon);
    
    // Iframe container (hidden initially)
    const iframe = document.createElement('iframe');
    iframe.className = 'video-iframe';
    iframe.setAttribute('frameborder', '0');
    iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
    iframe.setAttribute('allowfullscreen', 'true');
    // Add autoplay=0 to prevent auto-playing
    iframe.src = videoUrl + '?autoplay=0&enablejsapi=1';
    
    // Video info
    const infoDiv = document.createElement('div');
    infoDiv.className = 'video-info';
    infoDiv.innerHTML = '<h3>Official Music Video</h3>';
    
    videoCard.appendChild(thumbnailDiv);
    videoCard.appendChild(iframe);
    videoCard.appendChild(infoDiv);
    
    // Click handler to load/play video
    thumbnailDiv.addEventListener('click', () => {
      // Hide thumbnail, show iframe
      thumbnailDiv.classList.add('hidden');
      iframe.classList.add('active');
      // Load the video with autoplay=1 when clicked
      iframe.src = videoUrl + '?autoplay=1&enablejsapi=1';
    });
    
    videoGallery.appendChild(videoCard);
  });
</script>
</body>
</html>
