<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>The Carter Projekt | Music</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #0a0a0a; color: #e5e5e5; font-family: 'Inter', system-ui, sans-serif; line-height: 1.6; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700;800&display=swap');
    
    nav { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); padding: 1rem 2rem; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,153,0,0.2); }
    .logo-container { display: flex; align-items: center; gap: 12px; }
    .logo-img { height: 55px; width: auto; border-radius: 10px; }
    .logo { font-size: 1.4rem; font-weight: 800; text-transform: uppercase; background: linear-gradient(135deg, #f90, #ffdd88); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links { list-style: none; display: flex; gap: 1.8rem; }
    .nav-links li a { color: #f0f0f0; text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .nav-links li a:hover { color: #f90; }
    .social-icons { display: flex; gap: 1.2rem; }
    .social-icons a { font-size: 1.5rem; transition: transform 0.2s; }
    .social-icons a .fa-instagram { color: #fff; }
    .social-icons a:hover .fa-instagram { color: #E4405F; }
    .social-icons a .fa-youtube { color: #fff; }
    .social-icons a:hover .fa-youtube { color: #FF0000; }
    .social-icons a .fa-facebook-f { color: #fff; }
    .social-icons a:hover .fa-facebook-f { color: #1877F2; }
    .social-icons a:hover { transform: translateY(-3px); }
    .menu-toggle { display: none; font-size: 1.8rem; cursor: pointer; color: #f90; }
    
    .page-hero { height: 50vh; background: linear-gradient(135deg, #1a1a2e, #0a0a0a); display: flex; align-items: center; justify-content: center; text-align: center; margin-top: 70px; }
    .page-hero h1 { font-size: 4rem; background: linear-gradient(135deg, #fff, #f90); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    
    .section { padding: 4rem 2rem; max-width: 1200px; margin: 0 auto; }
    .section h2 { font-size: 2.5rem; margin-bottom: 2rem; border-left: 4px solid #f90; padding-left: 1.2rem; }
    
    .music-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
    .music-card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 1.5rem; transition: transform 0.3s; }
    .music-card:hover { transform: translateY(-5px); }
    .music-card iframe { width: 100%; border-radius: 12px; margin-bottom: 1rem; }
    .music-card h3 { color: #f90; margin-bottom: 0.5rem; }
    
    footer { background: #000; padding: 2rem; text-align: center; color: #777; border-top: 1px solid rgba(255,153,0,0.2); }
    
    @media (max-width: 900px) {
      .menu-toggle { display: block; }
      .nav-links { position: fixed; top: 75px; left: -100%; flex-direction: column; background: rgba(0,0,0,0.95); width: 70%; height: calc(100vh - 75px); padding: 2rem; gap: 1.5rem; transition: left 0.3s; border-radius: 0 20px 20px 0; }
      .nav-links.active { left: 0; }
      .page-hero h1 { font-size: 2.5rem; }
      .section h2 { font-size: 2rem; }
    }
  </style>
</head>
<body>
<nav>
  <div class="logo-container"><img src="Weixin Image_20260119132104_251_83.jpg" alt="Logo" class="logo-img"><div class="logo">THE CARTER PROJEKT</div></div>
  <div class="menu-toggle" id="mobileMenuToggle">☰</div>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li><li><a href="music.html">Music</a></li><li><a href="tour.html">Tour</a></li>
    <li><a href="videos.html">Videos</a></li><li><a href="photos.html">Photos</a></li><li><a href="store.html">Store</a></li>
    <li><a href="newsletter.html">Newsletter</a></li><li><a href="support.html">Support</a></li>
  </ul>
  <div class="social-icons">
    <a href="https://www.instagram.com/thecarterprojekt" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://youtube.com/@gbanjah" target="_blank"><i class="fab fa-youtube"></i></a>
    <a href="https://www.facebook.com/carterprojekt" target="_blank"><i class="fab fa-facebook-f"></i></a>
  </div>
</nav>

<section class="page-hero"><div><h1>MUSIC</h1><p style="margin-top:1rem;">Stream the latest releases</p></div></section>

<section class="section">
  <h2>Latest Releases</h2>
  <div class="music-grid">
    <div class="music-card"><iframe style="border-radius:12px" src="https://open.spotify.com/embed/album/4gRw4uPeWz6GMF3FOTf3rG?utm_source=generator" height="352" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe><h3>Latest Album</h3><p>Out now on all platforms</p></div>
    <div class="music-card"><iframe style="border-radius:12px" src="https://open.spotify.com/embed/artist/1TIL8rMRhLvDbZJtKPXwKU?utm_source=generator" height="352" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe><h3>Artist Profile</h3><p>Follow on Spotify</p></div>
  </div>
</section>

<footer><p>&copy; 2025 The Carter Projekt. All rights reserved.</p></footer>

<script>
  const menuToggle = document.getElementById('mobileMenuToggle');
  const navLinks = document.getElementById('navLinks');
  if (menuToggle && navLinks) {
    menuToggle.addEventListener('click', () => navLinks.classList.toggle('active'));
    navLinks.querySelectorAll('a').forEach(link => link.addEventListener('click', () => navLinks.classList.remove('active')));
  }
</script>
</body>
</html>
